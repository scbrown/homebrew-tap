name: test

# Proves every formula in this checkout installs, runs and passes audit on both
# macOS architectures. Runs on pull requests and on pushes to main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stable and nightly admission controls
        run: python3 scripts/test-nightly.py
      - name: Formulas match the latest verified releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/generate.py --check

  formulas:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tap this checkout as scbrown/tap
        run: |
          taps="$(brew --repository)/Library/Taps/scbrown"
          mkdir -p "$taps"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
      - name: Prepare the runner's Python
        # GitHub's Intel macOS image ships a non-Homebrew Python that owns files
        # under /usr/local/bin, so python@3.13 cannot link there. This only
        # affects the throwaway runner; it is not part of any formula.
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: for py in python@3.12 python@3.13; do brew install "$py" || brew link --overwrite "$py"; done
      - name: Install, test and audit every formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          set -u
          failed=""
          for f in Formula/*.rb; do
            name="$(basename "$f" .rb)"
            echo "::group::$name"
            if brew install "scbrown/tap/$name" && brew test "scbrown/tap/$name" \
                && brew audit --strict "scbrown/tap/$name" \
                && scripts/check-installed.py "scbrown/tap/$name"; then
              echo "PASS $name"
            else
              echo "::error::$name failed install, test, audit or receipt"
              failed="$failed $name"
            fi
            # Stable and preview formulas intentionally own the same command.
            # Each install is tested before unlinking it for the next formula.
            brew unlink "scbrown/tap/$name" || true
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "FAILED:$failed"; exit 1; }
