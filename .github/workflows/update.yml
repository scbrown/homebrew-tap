name: update

# Hourly: regenerate formulas from each repo's latest stable release (assets
# verified against the release's own checksums), test them on macOS, and commit.
# Commits use only this repository's token. Source repos may hold a dispatch-only
# token that sends `stack-release` after a published release (aegis-em2); that
# only starts this run early, and the schedule stays as reconciliation.
on:
  # The first schedule (minute 17) never fired: zero schedule runs from 23:41Z to
  # 03:33Z although the workflow was active. Editing the cron re-registers it;
  # the lane counts as fixed only after one observed schedule-event run.
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  # Sent by a source repo's release workflow once a release is published. The
  # payload (repo, tag) is informational only: generate.py still regenerates
  # every formula from each repo's latest stable release, and no payload value
  # reaches a shell command, checkout ref or URL.
  repository_dispatch:
    types: [stack-release]

permissions:
  contents: write
  # A push made with GITHUB_TOKEN starts no workflows, so main would carry an
  # unchecked commit. workflow_dispatch is the one event that token may start.
  actions: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    steps:
      # A run queued behind another in the `update` group would otherwise check
      # out the commit that was main's head when its event fired. If the run
      # ahead pushed a bump, the queued run rebuilt the same bump on the stale
      # base and its push was rejected (run 43305335182). Reading main at start
      # time lets it see the bump and exit with no change. The ref is a constant.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record the release that triggered this run
        if: github.event_name == 'repository_dispatch'
        env:
          SRC_REPO: ${{ github.event.client_payload.repo }}
          SRC_TAG: ${{ github.event.client_payload.tag }}
        run: |
          if [[ "$SRC_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] &&
             [[ "$SRC_TAG" =~ ^([A-Za-z0-9]+-)*v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "stack-release from $SRC_REPO $SRC_TAG"
          else
            echo "stack-release with an unrecognised payload (not logged)"
          fi
      - name: Regenerate formulas
        id: gen
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/generate.py
          if git diff --quiet -- Formula && [ -z "$(git ls-files --others -- Formula)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare the runner's Python
        # GitHub's Intel macOS image ships a non-Homebrew Python that owns files
        # under /usr/local/bin, so python@3.13 cannot link there. This only
        # affects the throwaway runner; it is not part of any formula.
        if: steps.gen.outputs.changed == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: for py in python@3.12 python@3.13; do brew install "$py" || brew link --overwrite "$py"; done
      - name: Install, test and audit changed formulas
        if: steps.gen.outputs.changed == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          set -eu
          taps="$(brew --repository)/Library/Taps/scbrown"
          mkdir -p "$taps"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
          # Conflict checks also load unchanged peers before installation.
          for f in Formula/*.rb; do
            brew trust --formula "scbrown/tap/$(basename "$f" .rb)"
          done
          for f in $(git diff --name-only -- Formula; git ls-files --others -- Formula); do
            name="$(basename "$f" .rb)"
            brew install "scbrown/tap/$name"
            brew test "scbrown/tap/$name"
            brew audit --strict "scbrown/tap/$name"
          done
      - name: Commit
        if: steps.gen.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula
          names="$(git diff --cached --name-only | xargs -n1 basename | sed 's/[.]rb$//' | paste -sd, -)"
          git commit -m "formula: update $names to latest releases"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        id: commit
      - name: Check the pushed commit on main
        # Formulas were already tested above; this attaches test.yml's checks to
        # the new main commit so the next pull request has a green base.
        if: steps.gen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUSHED: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run test.yml --ref main
          for i in $(seq 1 20); do
            sleep 15
            sha="$(gh run list --workflow test.yml --event workflow_dispatch --limit 1 --json headSha --jq '.[0].headSha')"
            [ "$sha" = "$PUSHED" ] && { echo "test.yml dispatched for $PUSHED"; exit 0; }
          done
          echo "::error::test.yml was not dispatched for $PUSHED; main is unchecked"
          exit 1
